    <!-- Toolbar section -->
    <div class="toolbar">
      <button id="bold">Bold</button>
      <button id="italic">Italic</button>
      <button id="underline">Underline</button>
      <button id="clear">Clear</button>
      <button id="ai">AI</button>
      <span id="aiOutput"></span>
    </div>
    <div class="modal" id="ai-modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>AI Assistant</h2>
        <div class="instructions">
          <h3>How to use:</h3>
          <ol>
            <li>Click and drag to select cells in the grid.</li>
            <li>write your prompt in the textarea below.</li>
            <li>Click on the "Submit" button to get result beside toolbar.</li>
          </ol>
        </div>
        <h3>Prompt:</h3>
        <textarea
          id="aiInstructions"
          placeholder="e.g., provide me sum of selected cells..."
        ></textarea>
        <button id="submitPrompt" class="btn-submit">Submit</button>
      </div>
    </div>
    <!-- Formula bar section  -->
    <div class="formula-bar">
      <input type="text" id="address" disabled />
      <input type="text" id="formula" placeholder="Enter formula here..." />
    </div>

    <!-- grid-container -->
    <div class="grid-container">
      <div class="top-row"></div>
      <div class="left-col"></div>
      <div class="cells"></div>
    </div>
    <script type="module" src="./googleSheetClone.js"></script>
  </body>
